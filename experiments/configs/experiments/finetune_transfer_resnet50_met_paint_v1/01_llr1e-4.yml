schema_version: 1
experiment_id: finetune_transfer_resnet50_met_paint_01_llr1e-4_v1
description: >-
  Recipe transfer to ResNet-50, setting 01_llr1e-4: LoRA learning rate 1e-4.
  The H+ painting recipe with this family's own LoRA placement (LoRA on the 3x3 convolution of each bottleneck block, BatchNorm frozen),
  LayerNorm-MLP head of hidden width 1024 on the descriptor the frozen row scores,
  and the frozen row's preprocessing. Trained on the Met-identity-removed medium
  SYN split. The checkpoint is chosen on the painting checkpoint half with the
  0.001-point funnel; the configuration is chosen on the painting model-selection
  half. Generated by tooling/write_transfer_met_paint_configs.py.
dataset:
  path: data/datasets/museum_deduplication_hard_synth_v1_met_deduped_medium_o1m3h4_v1
split:
  file: ../../splits/museum_deduplication_hard_synth_v1_met_deduped_medium_o1m3h4_v1/hard_synth_class_disjoint_v1.json
models:
  include:
  - config: ../../models/resnet50_hf.yml
    model_id: microsoft/resnet-50
    revision: 34c2154c194f829b11125337b98c8f5f9965ff19
    embedding:
      output_dim: 2048
      normalize: true
      dtype: float32
      batch_size: 64
      pooling: pooler_output
    preprocessing:
      resize:
        mode: model_default
finetuning:
  configuration_id: transfer_resnet50_met_paint_01_llr1e-4_r4a4_last8_llr1e-4_hlr1e-4_hd1024_do0
  training_repeats:
    seeds: [42, 43, 44]
    require_complete: true
  model:
    type: resnet_hf_lora_conv_projection
    backbone: microsoft/resnet-50
    revision: 34c2154c194f829b11125337b98c8f5f9965ff19
    embedding_dim: 2048
    projection_dim: 2048
    lora:
      span: last8
      rank: 4
      alpha: 4
      dropout: 0.05
      bias: none
      inspect_modules: true
    head:
      type: mlp_projection
      hidden_dim: 1024
      dropout: 0.0
      output_dim: 2048
  preprocessing:
    resize:
      mode: center_crop
      size: 224
      resize_size: 256
      backend: torch
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  sampler:
    type: pk
    classes_per_batch: 64
    images_per_class: 4
  loss:
    name: multi_similarity
    alpha: 2.0
    beta: 50.0
    base: 0.5
    mining_epsilon: 0.1
  optimizer:
    name: adamw
    lr_lora: 0.0001
    lr_head: 0.0001
    weight_decay: 0.1
    eps: 1.0e-07
  train:
    epochs: 5
    precision: bf16
    scheduler: cosine
    warmup_ratio: 0.1
    grad_clip_norm: 1.0
    num_workers: 16
    seed: 42
    deterministic: true
    deterministic_warn_only: false
    early_stop_non_improving_epochs: 2
    # BatchNorm (frozen) rules out gradient caching; the full PK batch is one step.
    gradient_cache:
      enabled: false
    prefetch_factor: 2
  evaluation:
    checkpoint_selection:
      metric: mean_pair_completeness_at_k
      validation_set: met_checkpoint_selection
      k: [5, 10, 20, 40, 60, 80]
      pc_tie: 0.00001
      rr_tie: 0.01
      epoch_tiebreak: earliest
    top_k: [5, 10, 20, 40, 60, 80]
    target_pc: 0.95
    batch_size: 16
  data:
    train:
      subset: train
      roles:
      - modern_original
      - modern_generated
      - historic_archival
      - historic_print
      - historic_cropped_record
      - historic_framed_photo
    validation:
    - name: syn_val
      primary: true
      subset: val
      roles:
      - modern_original
      - historic_archival
      - historic_print
      - historic_cropped_record
      - historic_framed_photo
      retrieval_tasks:
      - task_id: syn_val_original_to_historic
        query:
          subset: val
          role: modern_original
        candidates:
          subset: val
          roles:
          - historic_archival
          - historic_print
          - historic_cropped_record
          - historic_framed_photo
        positive_policy: same_painting
        exclude_self: true
    - name: met_checkpoint_selection
      primary: false
      dataset:
        path: data/datasets/met_benchmark
      split:
        file: ../../splits/met_benchmark/met_painting_identity_halves_seed42_v1.json
      subset: checkpoint_selection
      roles: [query, catalog]
      retrieval_tasks:
      - task_id: met_checkpoint_selection_query_to_catalog
        query:
          subset: checkpoint_selection
          role: query
        candidates:
          subset: checkpoint_selection
          role: catalog
        positive_policy: same_painting
        exclude_self: true
  post_evaluations:
  - experiment: ../eval_met_painting_model_selection_from_finetuning_v1.yml
    checkpoint: best
    label: "ResNet-50 transfer 01_llr1e-4 — Met model selection"
run:
  output_dir: ./runs/finetune_transfer_resnet50_met_paint_v1
