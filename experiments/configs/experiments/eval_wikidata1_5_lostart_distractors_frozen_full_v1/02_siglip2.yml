schema_version: 1
experiment_id: eval_wikidata1_5_lostart_distractors_frozen_full_v1
description: >-
  Frozen baseline on the full Wikidata 1.5 catalog plus Lost Art historic distractors. Modern queries against
  historic candidates of the same painting.
dataset:
  path: data/datasets/wikidata1.5-lostart-distractors
split:
  file: ../../splits/wikidata1.5-lostart-distractors/test-only.json
models:
  include:
  - config: ../../models/siglip2.yml
    model_id: google/siglip2-giant-opt-patch16-384
    label: SigLIP2-PP
    color: '#CCBB44'
    group: frozen
    revision: a713301b217d38485fb2204c808367d10bc3cc40
    adapter_kwargs:
      attn_implementation: sdpa
    embedding:
      output_dim: null
      normalize: true
      dtype: float32
      batch_size: 16
      pooling: default
    preprocessing:
      resize:
        mode: letterbox
        size: 384
embedding:
  cache_policy: reuse_if_config_hash_matches
  cache_dir: data/experiments/artifacts/embeddings/wikidata1_5_lostart_distractors
  batch_size: 16
evaluation:
  similarity: cosine
  top_k: [1, 5, 10, 20, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160]
  cache_dtype: float32
  device: auto
  gpu_dtype: float32
  fp32_matmul_precision: ieee
  retrieval_tasks:
  - task_id: wikidata_full_modern_to_historic
    query:
      subset: test
      role: modern
    candidates:
      subset: test
      role: historic
    positive_policy: same_painting
    exclude_self: true
run:
  output_dir: ./runs/eval_wikidata1_5_lostart_distractors_frozen_full_v1
  save_similarity_cache: true
  fail_on_missing_images: true
  fail_on_empty_positives: true
