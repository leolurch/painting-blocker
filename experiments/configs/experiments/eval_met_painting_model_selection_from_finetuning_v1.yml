schema_version: 1
experiment_id: eval_met_painting_model_selection_from_finetuning_v1
description: >-
  Score the selected H+ checkpoint on the held-out painting-only Met
  model-selection half. Visitor queries against catalog photos of the same
  identities. This split is not used to choose the epoch.
dataset:
  path: data/datasets/met_benchmark
split:
  file: ../splits/met_benchmark/met_painting_identity_halves_seed42_v1.json
models:
  from_finetuning_checkpoint: true
embedding:
  cache_policy: reuse_if_config_hash_matches
  cache_dir: ./artifacts/embeddings/met_painting_model_selection_v1
  batch_size: 16
evaluation:
  similarity: cosine
  top_k: [5, 10, 20, 40, 60, 80]
  target_pc: [0.95, 0.99]
  cache_dtype: float32
  device: auto
  gpu_dtype: float32
  fp32_matmul_precision: ieee
  retrieval_tasks:
  - task_id: met_model_selection_query_to_catalog
    query:
      subset: model_selection
      role: query
    candidates:
      subset: model_selection
      role: catalog
    positive_policy: same_painting
    exclude_self: true
run:
  output_dir: ./runs/eval_met_painting_model_selection_from_finetuning_v1
  save_similarity_cache: false
  fail_on_missing_images: true
  fail_on_empty_positives: true
