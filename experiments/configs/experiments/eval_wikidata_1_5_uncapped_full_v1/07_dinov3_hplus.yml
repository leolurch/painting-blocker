schema_version: 1
experiment_id: eval_wikidata_1_5_uncapped_full_v1
description: >-
  Frozen DINOv3-H+ on Wikidata 1.5 with the identity edits and every crop kept.
  Sensitivity only. It does not choose a model.
dataset:
  path: data/datasets/wikidata-1.5-uncapped
split:
  file: ../../splits/wikidata-1.5-uncapped/test-only.json
models:
  include:
  - config: ../../models/dinov3.yml
    model_id: facebook/dinov3-vith16plus-pretrain-lvd1689m
    label: DINOv3-H+
    color: '#4477AA'
    group: frozen
    revision: c807c9eeea853df70aec4069e6f56b28ddc82acc
    embedding:
      output_dim: null
      normalize: true
      dtype: float32
      batch_size: 16
      pooling: default
    preprocessing:
      resize:
        mode: letterbox
        size: 512
embedding:
  cache_policy: reuse_if_config_hash_matches
  cache_dir: data/experiments/artifacts/embeddings/wikidata_1_5_uncapped_v1
  batch_size: 16
evaluation:
  similarity: cosine
  top_k: [1, 5, 10, 20, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160]
  cache_dtype: float32
  device: auto
  gpu_dtype: float32
  fp32_matmul_precision: ieee
  retrieval_tasks:
  - task_id: wikidata_full_modern_to_historic
    query:
      subset: test
      role: modern
    candidates:
      subset: test
      role: historic
    positive_policy: same_painting
    exclude_self: true
run:
  output_dir: ./runs/eval_wikidata_1_5_uncapped_full_v1
  save_similarity_cache: true
  fail_on_missing_images: true
  fail_on_empty_positives: true
